    name: 論文研究
    desc: 探索未知所留下的文獻
    ornament: 🜍
    tagline: |-
      向未知世界叩問後,
      留下的文獻與紀錄。
    listEyebrow: Chapter II · 論文研究
  - id: experience
    no: CHAPTER III
    name: 學歷與經歷
    desc: 修習的學識與效力過的公司
    ornament: ⚔
