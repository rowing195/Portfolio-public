bookTitle: 作品典藏錄
bookTitleLatin: CODEX OPERUM
author: 〔你的名字〕 Your Name

# 扉頁:quote 為置中引言,text 為其下較小的自介文字(換行會保留)
intro:
  quote: |-
    「凡走過的旅途,
    皆化為此書之頁。」
  text: |-
    此處放一段你的自我介紹。可以是專業背景、興趣領域,或任何你想讓翻閱者第一眼認識你的文字。

epilogue: |-
  本書仍在續寫。
  新的章節,將隨旅途展開。

# 章節定義:id 對應 content collection(experience 走 timeline.yaml 的學歷與經歷時間軸)
chapters:
